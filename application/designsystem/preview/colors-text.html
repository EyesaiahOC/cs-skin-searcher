<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="background:#1E2837;border:1px solid #304060;border-radius:6px;padding:20px 24px;">
<div style="color:#E0E8F0;font-size:18px;font-weight:600;margin-bottom:6px;">fg-1 — Primary text &nbsp;<span style="font-family:var(--font-mono);font-size:11px;color:#6A7F9A;">#E0E8F0</span></div>
<div style="color:#6A7F9A;font-size:13px;margin-bottom:6px;">fg-2 — Muted / status bar &nbsp;<span style="font-family:var(--font-mono);font-size:11px;">#6A7F9A</span></div>
<div style="color:#4A6080;font-size:13px;margin-bottom:6px;">fg-disabled — Disabled &nbsp;<span style="font-family:var(--font-mono);font-size:11px;">#4A6080</span></div>
<div style="color:#4A7FB5;font-size:13px;">accent — Focus, slider, active &nbsp;<span style="font-family:var(--font-mono);font-size:11px;">#4A7FB5</span></div>
</div>
</div></body></html>
