<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.tile{width:180px;background:#253347;border:1px solid #304060;border-radius:6px;padding:8px;box-sizing:border-box;cursor:pointer;font-family:var(--font-ui);}
.tile:hover{border-color:#4A7FB5;}
.thumb{width:100%;aspect-ratio:1.4;background:#253347;border-radius:4px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4A6080;font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;}
.thumb svg{width:22px;height:22px;stroke-width:1.5;}
.name{color:#E0E8F0;font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta{color:#6A7F9A;font-size:10px;font-family:var(--font-mono);margin-top:2px;}
</style></head>
<body><div class="card"><div style="display:flex;gap:12px;">
