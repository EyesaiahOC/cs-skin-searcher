<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div style="display:flex;gap:20px;align-items:center;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:80px;height:48px;background:#253347;border:1px solid #304060;border-radius:3px;"></div>
    <div class="label-k">3px · progress</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:80px;height:48px;background:#253347;border:1px solid #304060;border-radius:4px;"></div>
    <div class="label-k">4px · button/input</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:80px;height:48px;background:#253347;border:1px solid #304060;border-radius:6px;"></div>
    <div class="label-k">6px · card</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:80px;height:48px;background:#1E2837;border:2px solid #3A6090;border-radius:0;"></div>
    <div class="label-k">2px · window frame</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:48px;height:48px;background:#4A7FB5;border-radius:999px;"></div>
    <div class="label-k">circle · slider</div>
  </div>
</div></div></body></html>
