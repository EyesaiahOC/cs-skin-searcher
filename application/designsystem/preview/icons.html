<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<style>
.ig{display:flex;flex-direction:column;align-items:center;gap:6px;color:#E0E8F0;}
.ig svg{width:20px;height:20px;stroke-width:1.5;}
.lbl{font-family:var(--font-mono);font-size:10px;color:#6A7F9A;}
</style></head>
<body><div class="card"><div style="display:flex;gap:18px;flex-wrap:wrap;">
<div class="ig"><i data-lucide="search"></i><div class="lbl">search</div></div>
<div class="ig"><i data-lucide="chevron-left"></i><div class="lbl">back / prev</div></div>
<div class="ig"><i data-lucide="chevron-right"></i><div class="lbl">next</div></div>
<div class="ig"><i data-lucide="arrow-up-right"></i><div class="lbl">workshop</div></div>
<div class="ig"><i data-lucide="crosshair"></i><div class="lbl">inspect</div></div>
<div class="ig"><i data-lucide="tag"></i><div class="lbl">tagger</div></div>
<div class="ig"><i data-lucide="plus"></i><div class="lbl">add tag</div></div>
<div class="ig"><i data-lucide="x"></i><div class="lbl">remove</div></div>
<div class="ig"><i data-lucide="shuffle"></i><div class="lbl">random</div></div>
<div class="ig"><i data-lucide="filter"></i><div class="lbl">filter</div></div>
</div></div>
<script>lucide.createIcons();</script></body></html>
