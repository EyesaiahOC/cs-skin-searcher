<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CS2 Skin Browser — UI Kit</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [view, setView] = useState('browser');        // 'browser' | 'detail'
  const [activeIdx, setActiveIdx] = useState(-1);
  const [query, setQuery] = useState('');
  const [weapon, setWeapon] = useState('All Weapons');
  const [tagger, setTagger] = useState(false);

  const open = (i) => { setActiveIdx(i); setView('detail'); };
  const back = () => setView('browser');
  const random = () => open(Math.floor(Math.random() * SKINS.length));

  return (
    <div className="app-window">
      {view === 'browser' ? (
        <BrowserView
          skins={SKINS} query={query} setQuery={setQuery}
          weapon={weapon} setWeapon={setWeapon}
          onOpen={open} activeIdx={activeIdx}
          onTagger={()=>setTagger(true)} onRandom={random}/>
      ) : (
        <DetailView
          skin={SKINS[activeIdx]} onBack={back}
          weapon={weapon} setWeapon={setWeapon}
          query={query} setQuery={setQuery}
          skins={SKINS}
          onTagger={()=>setTagger(true)} onRandom={random}/>
      )}
      <StatusBar loaded={1321} ready={true}
                 current={view==='detail' && activeIdx>=0 ? SKINS[activeIdx].name : null}/>
      {tagger && <TaggerModal onClose={()=>setTagger(false)} skins={SKINS.slice(0, 8)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
